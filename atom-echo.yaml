# Switch 2 Waker for the M5Stack Atom Echo
# Button = wake, LED = blue while broadcasting.
substitutions:
  name: switch2-waker
  friendly_name: Switch 2 Waker
  name_add_mac_suffix: "true"

packages:
  switch2_waker: github://amdydesign/switch2-waker/switch2-waker.yaml@main

dashboard_import:
  package_import_url: github://amdydesign/switch2-waker/atom-echo.yaml@main
  import_full_config: false

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "Button"
    on_click:
      - script.execute: wake

light:
  - platform: esp32_rmt_led_strip
    id: led
    name: "LED"
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    rgb_order: GRB
    entity_category: config

script:
  - id: status_led_on
    then:
      - light.turn_on:
          id: led
          red: 0%
          green: 40%
          blue: 100%
          brightness: 60%
  - id: status_led_off
    then:
      - light.turn_off: led
